<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradado de Fondo -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1035" />
    </linearGradient>

    <!-- Degradado del Globo de Chat -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Degradado del Borde -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Degradados para Chispas de IA (Gemini) -->
    <linearGradient id="sparkleGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="sparkleGradSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Filtro de Resplandor (Glow) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Contenedor Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGlow)" />
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="6" opacity="0.4" />

  <!-- Luz Ambiental de Fondo -->
  <ellipse cx="256" cy="240" rx="140" ry="120" fill="#818CF8" opacity="0.15" filter="url(#softGlow)" />

  <!-- Globo de Chat -->
  <g id="chatBubble">
    <path d="M 144 128 
             H 368 
             A 56 56 0 0 1 424 184 
             V 280 
             A 56 56 0 0 1 368 336 
             H 232 
             L 160 392 
             V 336 
             H 144 
             A 56 56 0 0 1 88 280 
             V 184 
             A 56 56 0 0 1 144 128 Z" 
          fill="url(#bubbleGrad)" 
          stroke="url(#borderGrad)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Destellos Gemini AI -->
  <path d="M 240 180 Q 240 230 190 230 Q 240 230 240 280 Q 240 230 290 230 Q 240 230 240 180 Z" fill="url(#sparkleGradPrimary)" filter="url(#glow)" />
  <path d="M 320 170 Q 320 195 295 195 Q 320 195 320 220 Q 320 195 345 195 Q 320 195 320 170 Z" fill="url(#sparkleGradSecondary)" />
  <circle cx="170" cy="275" r="8" fill="#38BDF8" opacity="0.9" filter="url(#glow)" />
  <circle cx="340" cy="275" r="5" fill="#C084FC" opacity="0.8" />
</svg>
